<div class="github-container">
  <h3>Mis Proyectos en GitHub (API REST)</h3>
  
  <div class="repos-list">
    <div *ngFor="let repo of repos" class="repo-item">
      <h4>{{ repo.name }}</h4>
      
      <p>{{ repo.description || 'Sin descripción disponible' }}</p>
      <p>⭐ Estrellas: {{ repo.stargazers_count }}</p>
      
      <a [href]="repo.html_url" target="_blank">Ver Código Fuente</a>
    </div>
  </div>
</div>
